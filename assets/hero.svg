<?xml version="1.0" encoding="UTF-8"?>
<!--
	pr-results hero banner: a pull request card receives a comment while its checks tick in, one failing and then fixed.

	(c) Copyright 2026 Liminal HQ, Scott Morris
	SPDX-License-Identifier: Apache-2.0 OR MIT

	How to edit: the scene is built from the shapes below, with no text inside it. The loop is 9 s and
	every animation lasts 9 s, so the keyTimes are fractions of one loop: checks tick in at 0.10, 0.20,
	0.30 (which fails) and 0.40; the comment arrives at 0.48; the failing check is retried at 0.64 and
	passes at 0.72; the comment updates in place at 0.78; everything fades out from 0.94. Keep the
	.motion and .static pairs, the 1200 x 320 viewBox, SMIL only and a title under about 16
	characters. Check every change with scripts/check-banner.sh and its shots option, and look at the
	frames (docs/new-project.md has the commands).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="hero-title hero-desc" data-loop="9">
	<title id="hero-title">pr-results</title>
	<desc id="hero-desc">pr-results: Calm test and check results for pull requests: one sticky comment and a check run per suite, from JUnit and step reports. A Liminal HQ Labs experiment. An animated banner shows a pull request card. Four checks tick in one by one and the third fails, then a comment arrives listing the results. The failing check is retried and passes, and the comment updates in place.</desc>

	<style>
		.ui { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Adwaita Sans', Inter, sans-serif; }
		.mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace; }
		.bg-a { stop-color: #0c0e16; }
		.bg-b { stop-color: #161a28; }
		.edge { fill: none; stroke: #2a3040; }
		.static { display: none; }
		@media (prefers-color-scheme: dark) {
			.bg-a { stop-color: #050507; }
			.bg-b { stop-color: #0e1019; }
			.edge { stroke: #1d212c; }
		}
		@media (prefers-reduced-motion: reduce) {
			.motion { display: none; }
			.static { display: inline; }
		}
	</style>

	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop class="bg-a" offset="0"/>
			<stop class="bg-b" offset="1"/>
		</linearGradient>
		<linearGradient id="afterglow" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.55" stop-color="#ffaa40"/>
			<stop offset="1" stop-color="#f43f5e"/>
		</linearGradient>
		<radialGradient id="wash">
			<stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/>
			<stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="glow">
			<stop offset="0" stop-color="#4ade80" stop-opacity="0.14"/>
			<stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
		</radialGradient>
		<clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
	</defs>

	<g clip-path="url(#frame)">
		<rect data-bg="" width="1200" height="320" fill="url(#bg)"/>
		<circle cx="70" cy="330" r="260" fill="url(#wash)"/>
		<circle cx="976" cy="160" r="230" fill="url(#glow)"/>

