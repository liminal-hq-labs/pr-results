# nextest settings: the `ci` profile writes JUnit that pr-results itself can read.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[profile.default]
fail-fast = true

[profile.ci]
fail-fast = false
retries = 1
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
