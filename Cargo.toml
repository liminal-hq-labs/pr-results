[workspace]
resolver = "2"
members = ["crates/pr-results-core", "crates/pr-results-render", "crates/pr-results"]

[workspace.package]
version = "0.1.0-dev"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/liminal-hq-labs/pr-results"
publish = false

[workspace.dependencies]
quick-xml = { version = "=0.42.0", default-features = false }
pr-results-core = { version = "0.1.0-dev", path = "crates/pr-results-core" }
pr-results-render = { version = "0.1.0-dev", path = "crates/pr-results-render" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Untrusted input must never panic the tool: no unwrap, expect, panic or unchecked indexing in
# library code. Test code opts out at the top of each test file.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
