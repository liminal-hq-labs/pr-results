[workspace]
resolver = "2"
members = ["crates/pr-results-core", "crates/pr-results-render", "crates/pr-results-forge", "crates/pr-results"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/liminal-hq-labs/pr-results"
publish = false

[workspace.dependencies]
quick-xml = { version = "=0.42.0", default-features = false }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
toml = { version = "=1.2.1", default-features = false, features = ["parse"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
# Only the tests use it: a loopback TLS server for the CA-file tests. The features are the ones
# `ureq` already enables for the client, so it adds no crate (decision D61).
rustls = { version = "=0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
pr-results-core = { version = "0.1.0", path = "crates/pr-results-core" }
pr-results-render = { version = "0.1.0", path = "crates/pr-results-render" }
pr-results-forge = { version = "0.1.0", path = "crates/pr-results-forge" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Untrusted input must never panic the tool: no unwrap, expect, panic or unchecked indexing in
# library code. Test code opts out at the top of each test file.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The release binary is small and reproducible: one codegen unit and fat LTO so the same source
# gives the same bytes, `panic = "abort"` and `opt-level = "z"` to keep it small (2.17 MB against
# 3.65 MB for the defaults, decision D55), and no symbols. Tests always unwind, whatever this says.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
