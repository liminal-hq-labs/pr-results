# Dependency policy: permissive licences only, crates.io only, known advisories fail the build.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

[graph]
targets = [
	"x86_64-unknown-linux-gnu",
	"x86_64-unknown-linux-musl",
	"aarch64-unknown-linux-musl",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
	"MIT",
	"Apache-2.0",
	# `ring` (Apache-2.0 AND ISC), `rustls-webpki` and `untrusted`, under `rustls` for `ureq`.
	"ISC",
	# `subtle`, under `rustls` for `ureq`.
	"BSD-3-Clause",
	# `webpki-roots` (the Mozilla root certificates as data), for `ureq`.
	"CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
