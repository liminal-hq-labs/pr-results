# One job per check, so a pull request's checks list names exactly what passed or failed.
# Language-neutral checks run as they are; uncomment the Rust block below (or add the
# equivalent for the project's language) once there is code to check.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
