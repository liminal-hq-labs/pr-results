# One job per check, so a pull request's checks list names exactly what passed or failed.
# The Rust jobs run in the shared ci-rust image. The reproducible-build job the specification lists
# follows with the release.
#
# Every action is pinned by full commit SHA with its version in a comment, and images by digest.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  markdown:
    name: Markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'

  links:
    name: Link check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml '**/*.md'
          token: ${{ github.token }}
          fail: true

  headers:
    name: Licence headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SPDX headers
        run: bash scripts/check-headers.sh

  banner:
    name: Hero banner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SVG tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxml2-utils librsvg2-bin fonts-dejavu-core fonts-liberation

      # The runner image ships Google Chrome, which the text-fit pass drives headless.
      - name: Check the banner
        env:
          BANNER_REQUIRE_RENDER: '1'
        run: bash scripts/check-banner.sh

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.12
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # The workflows and steps the documents show are copied into repositories, so they get the
      # same linting as the ones here.
      - name: Run actionlint over the documents' YAML
        run: bash scripts/check-doc-yaml.sh

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocking from the first run. Findings stay in the job log rather than the code-scanning
      # tab, so the job needs no `security-events` permission.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  # Rust: one job per check in the shared ci-rust image, whose digest comes from
  # https://github.com/liminal-hq/.github/blob/main/docs/reference/recommended-image-pins.md

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pr-results

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pr-results

      - name: Run the tests
        run: cargo nextest run --workspace --locked --profile ci

      # The publisher of this repository's own results reads these two artefacts.
      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the event file
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-file
          path: ${{ github.event_path }}
          retention-days: 14

  goldens:
    name: Goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pr-results

      # Every test that compares output with a file under a `golden` directory: the renderer's
      # scenarios, the publisher's request sequences and the command line's `render`. `CI` is
      # set, which makes `PR_RESULTS_BLESS` an error, so a golden cannot be rewritten here.
      - name: Compare the goldens
        run: cargo nextest run --workspace --locked --no-tests=fail -E 'binary(golden) | test(golden)'

  deny:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the dependencies
        run: cargo deny check

  action-smoke:
    name: Action smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs this checkout's own action, built from source: a pull request cannot pin a release
      # that does not exist yet, and render needs no token.
      - name: Validate this repository's settings
        uses: ./ # zizmor: ignore[self-repository] actionlint rejects the `$/` form
        with:
          command: validate-config
          build: source

      - name: Render the fixtures
        uses: ./ # zizmor: ignore[self-repository] actionlint rejects the `$/` form
        with:
          command: render
          build: source
          args: --title Smoke --out ${{ runner.temp }}/smoke tests/fixtures/nextest/pass.xml tests/fixtures/nextest/fail.xml

      - name: Check what it wrote
        env:
          SMOKE: ${{ runner.temp }}/smoke
        run: |
          test -s "$SMOKE/comment.md"
          test -s "$SMOKE/checks/0.md"
          grep -q '^<!-- pr-results:1 key=ci ' "$SMOKE/comment.md"
          grep -q '^### Smoke: ' "$SMOKE/comment.md"

  pins:
    name: Release pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Proves the check itself rejects each way of weakening the install step or the pins.
      - name: Test the pin check
        run: bash scripts/test-check-pins.sh

      # Online: asks GitHub (read access to public repositories, with the workflow's
      # `contents: read` token) whether every `# vX` comment names the pinned commit.
      - name: Check the pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-pins.sh

  # The reproducible build (the musl binaries built twice, with their digests compared) follows
  # with the release.
