# Posts the results of this repository's own CI run to its pull request, with its own release.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# This is how a consumer uses the tool: the reusable workflow, pinned by the commit of a release tag,
# which in turn pins the exact binary by its SHA-256. No pull request's code and no compiler runs in
# the job that holds the write token. It is inert until this file is on the default branch, because
# `workflow_run` workflows run from there. To go back to the default branch's own source, call the
# action with `build: source` (docs/releasing.md).


name: Publish Test Results

on:
  # zizmor: ignore[dangerous-triggers] This is the publisher the design needs: it holds the write token
  # but runs only a pinned release, reads the run's artefacts as untrusted data and never checks out a
  # pull request.
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  publish:
    name: Publish
    if: github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read # list and download the run's artefacts
      checks: write # create and update check runs and annotations
      pull-requests: write # create and update the sticky comment
      contents: read # check out .github/ from the default branch (needed in private repositories)
    uses: liminal-hq-labs/pr-results/.github/workflows/publish.yml@a70c20d946cfe13ed8199018feee88578a96ae51 # v0.4.1
