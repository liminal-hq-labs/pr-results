# Builds the release binaries from a version tag, checks them against the pinned digests and publishes them.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The tag is pushed by the owner after the release pull request has merged. The build job rebuilds
# each binary, on a runner of its own architecture, in the same pinned image as the `Reproducible
# build` job and stops if its SHA-256 is not the one `action.yml` and `publish.yml` already carry,
# because those pins are what consumers trust. Only when both targets match does the release job
# attest the files and create the release. See `docs/releasing.md`.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            pin: PR_RESULTS_SHA256_X86_64
          - name: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            pin: PR_RESULTS_SHA256_AARCH64
    container:
      image: ghcr.io/liminal-hq/ci-rust@sha256:0ef31efa5876407765cd5572a23323932183a5357eaac92eee67d79657d45c02
    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every branch, to see that the tag is on the default branch
          persist-credentials: false

      # A release comes from reviewed code: the tag must be a plain version and its commit must be
      # on the default branch.
      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The container's user does not own the checkout, so git needs it marked safe first (the
          # runner sets GITHUB_WORKSPACE to the path inside the container); the script does that,
          # and keeps "not on main" apart from "could not compare".
          bash scripts/check-release-tag.sh
          # Offline: the container has no `gh`, and the `Release pins` job asks GitHub.
          bash scripts/check-pins.sh --offline

      - name: Install the musl C compiler
        run: |
          apt-get update
          apt-get install -y --no-install-recommends musl-tools

      # The musl packages must be the versions the pinned digests were built with, and nothing may
      # override the flags the build script sets.
      - name: Check the toolchain
        run: bash scripts/check-toolchain.sh

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          OUT_DIR: ${{ runner.temp }}/release
        run: bash scripts/build-release.sh "$TARGET" "$OUT_DIR"

      # The digest the consumers pin must be the digest of what is about to be released. A mismatch
      # fails the job, and nothing is published.
      - name: Compare with the pinned digests
        env:
          TARGET: ${{ matrix.target }}
          PIN: ${{ matrix.pin }}
          OUT_DIR: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          got="$(sha256sum "$OUT_DIR/pr-results-$TARGET" | cut -d ' ' -f 1)"
          status=0
          for file in action.yml .github/workflows/publish.yml; do
            want="$(sed -n "s/^[[:space:]]*${PIN}:[[:space:]]*//p" "$file")"
            if [ "$want" != "$got" ]; then
              echo "::error file=$file::The rebuilt binary is $got but $file pins '$want'."
              status=1
            fi
          done
          if [ "$status" != 0 ]; then
            exit 1
          fi
          echo "The rebuilt binary matches the pins: $got"

      - name: Run the binary
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ runner.temp }}/release
        run: '"$OUT_DIR/pr-results-$TARGET" --version'

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ runner.temp }}/release/pr-results-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestation with a short-lived certificate
      attestations: write # store the attestation for the repository
    steps:
      - name: Download the binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release

      # The files about to be attested must still be the pinned ones: compare them again with the
      # pins in `action.yml` at the tagged commit, so an artefact swapped between the jobs fails here.
      - name: Checkout the pins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            action.yml
            .github/workflows/publish.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
          path: pins

      - name: Compare with the pinned digests
        run: |
          set -euo pipefail
          status=0
          for pair in x86_64:X86_64 aarch64:AARCH64; do
            arch="${pair%%:*}"
            key="PR_RESULTS_SHA256_${pair##*:}"
            got="$(sha256sum "release/pr-results-${arch}-unknown-linux-musl" | cut -d ' ' -f 1)"
            for file in pins/action.yml pins/.github/workflows/publish.yml; do
              want="$(sed -n "s/^[[:space:]]*${key}:[[:space:]]*//p" "$file")"
              if [ "$want" != "$got" ]; then
                echo "::error::The ${arch} file is $got but ${file#pins/} pins '$want'."
                status=1
              fi
            done
          done
          exit "$status"

      # One checksum file for both binaries.
      - name: Write the checksums
        run: |
          set -euo pipefail
          cd release
          binaries=(pr-results-*)
          if [ "${#binaries[@]}" != 2 ]; then
            echo "::error::Expected two binaries, found: ${binaries[*]}"
            exit 1
          fi
          sha256sum pr-results-aarch64-unknown-linux-musl pr-results-x86_64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      # The notes come from the pull requests since the previous tag, grouped by the categories in
      # `.github/release.yml`.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            release/pr-results-aarch64-unknown-linux-musl \
            release/pr-results-x86_64-unknown-linux-musl \
            release/SHA256SUMS
